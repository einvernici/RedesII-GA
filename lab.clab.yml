name: bird-uni-lab

topology:
  kinds:
    linux:
      image: ghcr.io/srl-labs/bird:2.13.1
  nodes:
    r1:
      kind: linux
      binds:
        - /home/einvernici/bird-uni-lab/current_config/r1.conf:/etc/bird.conf:ro # <--- FIXED INNER PATH
      exec:
        - ip addr add 10.1.2.1/24 dev eth1
    r2:
      kind: linux
      binds:
        - /home/einvernici/bird-uni-lab/current_config/r2.conf:/etc/bird.conf:ro # <--- FIXED INNER PATH
      exec:
        - ip addr add 10.1.2.2/24 dev eth1
        - ip addr add 10.2.4.2/24 dev eth2
        - ip addr add 10.2.3.2/24 dev eth3
    r3:
      kind: linux
      binds:
        - /home/einvernici/bird-uni-lab/current_config/r3.conf:/etc/bird.conf:ro # <--- FIXED INNER PATH
      exec:
        - ip addr add 10.2.3.3/24 dev eth1
        - ip addr add 10.3.4.3/24 dev eth2
    r4:
      kind: linux
      binds:
        - /home/einvernici/bird-uni-lab/current_config/r4.conf:/etc/bird.conf:ro # <--- FIXED INNER PATH
      exec:
        - ip addr add 10.2.4.4/24 dev eth1
        - ip addr add 10.3.4.4/24 dev eth2
        - ip addr add 10.4.5.4/24 dev eth3
    r5:
      kind: linux
      binds:
        - /home/einvernici/bird-uni-lab/current_config/r5.conf:/etc/bird.conf:ro # <--- FIXED INNER PATH
      exec:
        - ip addr add 10.4.5.5/24 dev eth1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r4:eth1"]
    - endpoints: ["r2:eth3", "r3:eth1"]
    - endpoints: ["r3:eth2", "r4:eth2"]
    - endpoints: ["r4:eth3", "r5:eth1"]


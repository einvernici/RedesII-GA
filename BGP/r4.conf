router id 4.4.4.4;

protocol device {
    scan time 2;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 { export all; import all; };
}

protocol bgp R2 {
    local as 65002;
    neighbor 10.2.4.2 as 65002;

    ipv4 {
        import all;
        export all;
    };
}

protocol bgp R3 {
    local as 65002;
    neighbor 10.3.4.3 as 65002;

    ipv4 {
        import all;
        export all;
    };
}

protocol bgp R5 {
    local as 65002;
    neighbor 10.4.5.5 as 65003;

    ipv4 {
        import all;
        export all;
    };
};

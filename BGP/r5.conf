router id 5.5.5.5;

protocol device {
    scan time 2;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 { export all; import all; };
}

protocol bgp R4 {
    local as 65003;
    neighbor 10.4.5.4 as 65002;

    ipv4 {
        import all;
        export all;
    };
};

router id 1.1.1.1;

protocol device {
    scan time 2;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 { export all; import all; };
}

protocol bgp R2 {
    local as 65001;
    neighbor 10.1.2.2 as 65002;

    ipv4 {
        import all;
        export none;
    };
};

router id 1.1.1.1;

protocol device {
    scan time 2;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 { export all; import all; };
}

protocol rip UniRIP {
    ipv4 {
        import all;
        export all;
    };

    interface "eth1" {
        mode multicast;
    };
}
